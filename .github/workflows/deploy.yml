name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    # Native arm64, matching the t4g.micro this deploys to.
    #
    # This used to be `ubuntu-latest` (x64) with `docker/setup-qemu-action`
    # emulating arm64, and emulation was not merely slow — it was unsound.
    # Builds intermittently died with
    #   qemu: uncaught target signal 4 (Illegal instruction) - core dumped
    #   ⨯ Next.js build worker exited with code: null and signal: SIGILL
    # during "Generating static pages", i.e. QEMU hit an instruction it does not
    # implement in one of Next's parallel build workers. The same fault could
    # also wedge a worker instead of killing it, which once left a run hanging
    # until GitHub's 6-hour job timeout cancelled it. It got likelier as the
    # static page count grew (41 pages at the time of this change).
    #
    # arm64 runners are free for public repositories, so this costs nothing and
    # removes the whole failure class rather than retrying around it. Builds are
    # also several times faster without emulation.
    #
    # ⚠ If this repository ever goes private, these runners stop being free —
    # arm64 is available on private repos only on paid plans. Reverting to QEMU
    # would bring the SIGILL crashes back, so the alternative would be a
    # self-hosted arm64 runner or building the Next app on x64 and assembling
    # only the runtime image for arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      # No `setup-qemu-action`: the runner is already arm64, so there is nothing
      # to emulate. Re-adding it would silently reintroduce the crash above.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/yassersalama22/goldcompass-v2:latest
          # Turnstile site key is public (inlined into the client bundle at build
          # time). Can be a repo secret or a plain `vars.` variable. Runtime
          # TURNSTILE_SECRET_KEY lives in the box's .env, not here.
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_CF_BEACON_TOKEN=${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_LOCALES_ENABLED=${{ vars.NEXT_PUBLIC_LOCALES_ENABLED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/goldcompass
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
