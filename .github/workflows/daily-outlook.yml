name: Daily Gold Outlook

# Generates the gold outlook daily and opens a Pull Request for human review.
# Merging the PR publishes it (updates current.json → ISR/redeploy serves it).
#
# The BUY / HOLD / SELL signals, their confidence and their levels are computed
# by rules (src/server/outlook/signal/) from a year of price data and the macro
# series — the model writes the analysis and may request a one-step adjustment
# for a dated, cited event. The PR body is generated: it leads with what
# changed since the last published outlook and why.
#
# Requires repo secret ANTHROPIC_API_KEY for real (web-grounded) content.
# Without it, the pipeline produces placeholder mock content — do not merge.
# FRED_API_KEY feeds four of the scorecard's eleven factors; without it the
# calls rest on price alone.

on:
  # Manual runs always generate. The scheduled run skips itself when today's
  # (UTC) outlook already exists — see the "Skip if already done today" step.
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily (GitHub may start it some minutes late)

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A manual run earlier the same UTC day makes the scheduled run redundant:
      # it would spend another generation and either open a PR nobody needs or
      # overwrite the open one (both runs share the outlook/daily-update branch).
      # Skips when today's outlook is already on main, or when the open PR
      # already carries today's outlook. An open PR from an earlier day is NOT
      # a reason to skip — that one is stale and the run should refresh it.
      # Manual runs never skip.
      - name: Skip if already done today
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: outlook/daily-update
          FILE: src/content/outlook/current.json
        run: |
          today=$(date -u +%F)
          skip=false
          reason=""

          published=$(jq -r '.date' "$FILE")
          if [ "$published" = "$today" ]; then
            skip=true
            reason="today's outlook ($today) is already published on main"
          elif git fetch --quiet --depth=1 origin "$BRANCH" 2>/dev/null \
            && [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            pending=$(git show "FETCH_HEAD:$FILE" | jq -r '.date')
            if [ "$pending" = "$today" ]; then
              skip=true
              reason="the open outlook PR already carries today's outlook ($today)"
            fi
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "::notice::Skipping scheduled run: $reason."
            echo "Skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No outlook for $today yet (main has $published) — generating."
          fi

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Generate + stage outlook
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional, but the scorecard's yield and dollar factors need it.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # `generate` writes the draft, the pending history entry and
        # outlook-review.md (the PR body, also appended to the job summary).
        # `publish` promotes the draft and appends the entry to history.json —
        # both land in the PR, so an unmerged draft leaves no trace in either.
        run: |
          npm run outlook:generate
          npm run outlook:publish
          npm run check:signal

      # No-op until a non-English locale is enabled in src/config/locales.ts:
      # TRANSLATION_TARGETS follows the *active* locale set, so this prints
      # "no translation targets" and exits 0 today. Wiring it now means the day
      # Arabic is switched on, the daily outlook is already translated in the
      # same PR — one review covering both languages rather than two.
      - name: Translate + verify
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only what this PR commits (see add-paths). Unscoped, the run would
          # also translate any stale articles/pages/catalog keys, pay for them,
          # and discard the output — every run, until a full pass landed.
          TRANSLATE_ONLY: outlook
        run: |
          npm run i18n:translate
          npm run i18n:check

      - name: Open pull request
        if: steps.guard.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: outlook/daily-update
          base: main
          title: "Outlook: daily gold update"
          commit-message: "Outlook: daily gold update"
          # Written by `outlook:generate`: what changed since the last published
          # outlook, the scorecard behind each call, any broken level or
          # adjustment, the events the model cited, and the review checklist.
          # It is gitignored and sits outside `add-paths`, so it is never committed.
          body-path: outlook-review.md
          add-paths: |
            src/content/outlook/**
          delete-branch: true
          assignees: yassersalama22
